services:
  db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_hub
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: local_development_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - campus_data:/var/lib/postgresql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_hub"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  campus_data:
